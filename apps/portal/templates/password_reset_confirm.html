{% extends "base.html" %}
{% block title %}Definir nova senha{% endblock %}
{% block body %}{% if validlink %}<h1>Definir nova senha</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Salvar nova senha</button></form>
{% else %}<h1>Link inválido ou expirado</h1><p><a href="{% url 'password_reset' %}">Solicitar outro link</a></p>{% endif %}{% endblock %}
