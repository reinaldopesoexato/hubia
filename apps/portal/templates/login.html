{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block body %}
<h1>Entrar no portal</h1><p>Use seu usuário cadastrado no HUB IA.</p>
{% if form.errors %}<p class="error" role="alert">Usuário ou senha inválidos.</p>{% endif %}
<form action="/conta/entrar/" method="post">{% csrf_token %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<label for="username">Usuário</label><input id="username" name="username" value="{{ form.username.value|default:'' }}" maxlength="150" autocomplete="username" required autofocus>
<label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Entrar</button></form>{% endblock %}
