<span class="avatar{% if large %} avatar-large{% endif %}" aria-hidden="true">{{ request.user.get_full_name|default:request.user.username|slice:":1"|upper }}{% if avatar_src %}<img alt="" src="{{ avatar_src }}" referrerpolicy="no-referrer" {% if avatar_fallback %}data-fallback="{{ avatar_fallback }}" {% endif %}onerror="if(this.dataset.fallback){const next=this.dataset.fallback;delete this.dataset.fallback;this.src=next}else{this.remove()}">{% endif %}</span>
