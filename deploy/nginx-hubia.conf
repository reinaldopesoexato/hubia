# Managed by HUB IA
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hubia.psxt.io;
    ssl_certificate /etc/letsencrypt/live/hubia.psxt.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hubia.psxt.io/privkey.pem;
    default_type "text/plain; charset=utf-8";
    location = /health/edge { return 200 "ok\n"; }
    location ^~ /conta/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18873;
        proxy_set_header Host hubia.psxt.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/\.well-known/(agent-card\.json|oauth-authorization-server(/conta/email)?|oauth-protected-resource(/conta/mcp(/email)?)?)$ {
        proxy_pass http://127.0.0.1:18873;
        proxy_set_header Host hubia.psxt.io;
        proxy_set_header X-Forwarded-Proto https;
    }
    root /var/www/hubia-public;
    location ~ ^/(hub-ia(-64)?\.png|apple-touch-icon\.png|favicon\.ico)$ {
        add_header Access-Control-Allow-Origin "*";
        types { image/png png; image/x-icon ico; }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = / {
        try_files /index.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }
}
