name: hubia

services:
  postgres:
    image: postgres:16.16-bookworm
    environment:
      POSTGRES_DB: hubia
      POSTGRES_USER: hub_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - hubia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hub_migrator", "-d", "hubia"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  hubia-db:
